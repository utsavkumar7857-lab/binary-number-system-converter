```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Binary Number System Converter</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Binary Number System Converter</h1>
        <p>Convert numbers between Binary, Octal, Decimal and Hexadecimal.</p>

        <h2>Number Converter</h2>

        <label for="numberInput">Enter Number</label>
        <input type="text" id="numberInput" placeholder="Enter a number">

        <label for="fromBase">Convert From</label>
        <select id="fromBase">
            <option value="2">Binary (Base 2)</option>
            <option value="8">Octal (Base 8)</option>
            <option value="10" selected>Decimal (Base 10)</option>
            <option value="16">Hexadecimal (Base 16)</option>
        </select>

        <label for="toBase">Convert To</label>
        <select id="toBase">
            <option value="2" selected>Binary (Base 2)</option>
            <option value="8">Octal (Base 8)</option>
            <option value="10">Decimal (Base 10)</option>
            <option value="16">Hexadecimal (Base 16)</option>
        </select>

        <button id="convertBtn" type="button">Convert</button>

        <h3>Result</h3>
        <p id="result">Your result will appear here.</p>
        <p id="error" role="alert"></p>
        <button id="copyBtn" type="button" style="display:none;">Copy Result</button>

        <h3>Try Examples</h3>
        <button type="button" data-example="45" data-from="10" data-to="2">45 to Binary</button>
        <button type="button" data-example="101101" data-from="2" data-to="10">Binary to Decimal</button>
        <button type="button" data-example="255" data-from="10" data-to="16">255 to Hexadecimal</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
